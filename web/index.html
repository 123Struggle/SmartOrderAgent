<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartOrderAgent - 智能点餐管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans">
  <!-- 头部导航 -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">🍽️</div>
      <div>
        <h1 class="text-lg font-bold text-slate-800">SmartOrder 智能点餐预订系统</h1>
        <p class="text-xs text-slate-500">DeepSeek + Milvus + Redis + LangGraph 驱动</p>
      </div>
    </div>
    <div class="text-xs text-slate-400 font-mono" id="sessionTag">Session: ...</div>
  </header>

  <!-- 消息展示区 -->
  <main id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto"></main>

  <!-- 底部交互与输入区 -->
  <footer class="bg-white border-t border-slate-200 p-4">
    <div class="max-w-4xl mx-auto space-y-3">
      <!-- 快捷标签推荐 -->
      <div class="flex flex-wrap gap-2 text-xs">
        <button onclick="sendQuickPrompt('你们餐厅有什么招牌特色菜？')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition">🍗 本店招牌菜</button>
        <button onclick="sendQuickPrompt('我想吃微辣且酸甜的肉类，有什么推荐？')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition">🌶️ 语义偏好推荐</button>
        <button onclick="sendQuickPrompt('请问营业时间是几点？好停车吗？')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition">🕒 营业与停车 (FAQ)</button>
        <button onclick="sendQuickPrompt('我想预订今晚7点4个人的位置，不要包间')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full transition">📝 预订桌位测试</button>
      </div>

      <!-- 输入框 -->
      <form id="chatForm" onsubmit="handleSubmit(event)" class="flex gap-2">
        <input 
          id="userInput" 
          type="text" 
          placeholder="请输入您的问题或需求（如预订、问菜、营业信息）..." 
          class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm shadow-inner"
        />
        <button 
          id="submitBtn"
          type="submit" 
          class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-3 rounded-xl transition shadow flex items-center justify-center text-sm"
        >
          发送
        </button>
      </form>
    </div>
  </footer>

  <script>
    let session = null;
    try { session = JSON.parse(sessionStorage.getItem("smartorder_session") || "null"); }
    catch (_) { sessionStorage.removeItem("smartorder_session"); }
    let sessionPromise = null;
    async function ensureSession() {
      if (!session) {
        if (!sessionPromise) sessionPromise = (async () => {
          const response = await fetch("/sessions", { method: "POST" });
          if (!response.ok) throw new Error("创建会话失败");
          session = await response.json();
          sessionStorage.setItem("smartorder_session", JSON.stringify(session));
        })();
        try { await sessionPromise; } finally { sessionPromise = null; }
      }
      document.getElementById("sessionTag").innerText = "Session: " + session.session_id;
      return session;
    }
    function authHeaders() {
      return { "Content-Type": "application/json", "Authorization": "Bearer " + session.session_token };
    }
    async function showDraft(draft) {
      if (!draft) return;
      const bubble = appendMessage("assistant", "请核对预订明细（北京时间）：\n" +
        Object.entries(draft.details).map(([k,v]) => ({num_people:"总人数",num_children:"儿童人数",arrival_time:"到达时间",seat_preference:"座位偏好",main_dish_preference:"主菜偏好",other_comments:"备注"}[k] + "：" + (v ?? "无"))).join("\n"));
      const button = document.createElement("button");
      button.textContent = "确认预订";
      button.className = "block mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg";
      button.onclick = async () => {
        button.disabled = true;
        try {
          const response = await fetch("/reservations/" + encodeURIComponent(draft.draft_id) + "/confirm", {
            method:"POST", headers:authHeaders(), body:JSON.stringify({confirm:true})
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "提交失败");
          appendMessage("assistant", "预订成功，订单号 #" + result.order_id);
          button.remove();
        } catch (error) {
          appendMessage("assistant", error.message + "；可重试同一预订。");
          button.disabled = false;
        }
      };
      bubble.appendChild(button);
    }
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const submitBtn = document.getElementById("submitBtn");

    ensureSession().then(async () => {
      const response = await fetch("/reservations/pending", {headers:authHeaders()});
      if (response.ok) await showDraft((await response.json()).draft);
      else if (response.status === 401) { session = null; sessionStorage.removeItem("smartorder_session"); }
    }).catch(error => appendMessage("assistant", error.message));

    // 初始欢迎消息
    appendMessage("assistant", "您好！我是您的智能餐饮管家。您可以向我咨询招牌菜品、个性化口味推荐、营业规则或直接办理订座，请问有什么可以帮您？");

    function appendMessage(role, content = "") {
      const wrapper = document.createElement("div");
      wrapper.className = `flex ${role === "user" ? "justify-end" : "justify-start"}`;

      const bubble = document.createElement("div");
      bubble.className = role === "user"
        ? "max-w-xl bg-emerald-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm shadow"
        : "max-w-2xl bg-white text-slate-800 rounded-2xl rounded-tl-sm px-4 py-3 text-sm border border-slate-200 shadow whitespace-pre-wrap leading-relaxed";

      bubble.innerText = content;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    function sendQuickPrompt(text) {
      userInput.value = text;
      handleSubmit(new Event('submit'));
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message || submitBtn.disabled) return;

      // 渲染用户输入
      appendMessage("user", message);
      userInput.value = "";
      userInput.disabled = true;
      submitBtn.disabled = true;

      // 创建助手回复气泡
      const assistantBubble = appendMessage("assistant", "");

      try {
        // 页面由同一个 FastAPI 服务提供，用相对路径即可；
        // 硬编码 127.0.0.1:8000 会在换端口/局域网访问时失效，并且会额外引入跨域。
        await ensureSession();
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ message: message, session_id: session.session_id })
        });

        if (!response.ok) {
          if (response.status === 401) {
            session = null;
            sessionStorage.removeItem("smartorder_session");
          }
          throw new Error("HTTP error " + response.status);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let completed = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop(); // 保留尚未结束的块

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const payload = JSON.parse(line.slice(6));
              if (payload.type === "token") assistantBubble.textContent += payload.text;
              else if (payload.type === "reservation") await showDraft(payload.draft);
              else if (payload.type === "error") throw new Error(payload.message);
              else if (payload.type === "done") completed = true;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          }
        }
        if (!completed) throw new Error("回复中断，请重试；已有草稿可刷新页面恢复");
      } catch (err) {
        assistantBubble.textContent += "\n通信失败: " + err.message;
      } finally {
        userInput.disabled = false;
        submitBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
